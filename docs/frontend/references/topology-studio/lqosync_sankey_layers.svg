<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="620" viewBox="0 0 1150 620"><rect width="100%" height="100%" rx="24" fill="#0b1220"/><text x="48" y="60" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#eaf2ff">Sankey canvas: three separate layers</text><rect x="48" y="94" width="1054" height="72" rx="14" fill="#17243a" stroke="#34516e"/><circle cx="83" cy="130" r="17" fill="#0d8bdc"/><text x="83" y="136" text-anchor="middle" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="white">1</text><text x="117" y="123" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#f5f9ff">Physical / logical inventory</text><text x="117" y="148" font-family="DejaVu Sans" font-size="15" fill="#a7bfd8">Router, interface, VLAN, PPP, DHCP, Hotspot relationships</text><rect x="48" y="188" width="1054" height="72" rx="14" fill="#17243a" stroke="#34516e"/><circle cx="83" cy="224" r="17" fill="#0d8bdc"/><text x="83" y="230" text-anchor="middle" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="white">2</text><text x="117" y="217" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#f5f9ff">Shaping hierarchy</text><text x="117" y="242" font-family="DejaVu Sans" font-size="15" fill="#a7bfd8">Effective LibreQoS parent tree and circuit membership</text><rect x="48" y="282" width="1054" height="72" rx="14" fill="#17243a" stroke="#34516e"/><circle cx="83" cy="318" r="17" fill="#0d8bdc"/><text x="83" y="324" text-anchor="middle" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="white">3</text><text x="117" y="311" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#f5f9ff">Traffic / capacity overlay</text><text x="117" y="336" font-family="DejaVu Sans" font-size="15" fill="#a7bfd8">Measured throughput, provisioned rates or subscriber counts</text><rect x="48" y="376" width="1054" height="72" rx="14" fill="#17243a" stroke="#34516e"/><circle cx="83" cy="412" r="17" fill="#0d8bdc"/><text x="83" y="418" text-anchor="middle" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="white">4</text><text x="117" y="405" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#f5f9ff">Candidate preview</text><text x="117" y="430" font-family="DejaVu Sans" font-size="15" fill="#a7bfd8">Visual diff is distinct from real-time traffic thickness</text><rect x="48" y="470" width="1054" height="72" rx="14" fill="#17243a" stroke="#34516e"/><circle cx="83" cy="506" r="17" fill="#0d8bdc"/><text x="83" y="512" text-anchor="middle" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="white">5</text><text x="117" y="499" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#f5f9ff">Compile and publish</text><text x="117" y="524" font-family="DejaVu Sans" font-size="15" fill="#a7bfd8">network.json and ShapedDevices.csv via validated writer</text></svg>