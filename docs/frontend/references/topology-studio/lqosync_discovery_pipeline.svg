<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="808" viewBox="0 0 1150 808"><rect width="100%" height="100%" rx="24" fill="#0b1220"/><text x="48" y="60" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#eaf2ff">Read-only discovery and validation</text><rect x="48" y="94" width="1054" height="72" rx="14" fill="#17243a" stroke="#34516e"/><circle cx="83" cy="130" r="17" fill="#0d8bdc"/><text x="83" y="136" text-anchor="middle" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="white">1</text><text x="117" y="123" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#f5f9ff">RouterOS snapshot</text><text x="117" y="148" font-family="DejaVu Sans" font-size="15" fill="#a7bfd8">PPP / DHCP / Hotspot / interfaces / routes; timestamps</text><rect x="48" y="188" width="1054" height="72" rx="14" fill="#17243a" stroke="#34516e"/><circle cx="83" cy="224" r="17" fill="#0d8bdc"/><text x="83" y="230" text-anchor="middle" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="white">2</text><text x="117" y="217" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#f5f9ff">Normalize and resolve identity</text><text x="117" y="242" font-family="DejaVu Sans" font-size="15" fill="#a7bfd8">Join source records; preserve stable circuit identifiers</text><rect x="48" y="282" width="1054" height="72" rx="14" fill="#17243a" stroke="#34516e"/><circle cx="83" cy="318" r="17" fill="#0d8bdc"/><text x="83" y="324" text-anchor="middle" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="white">3</text><text x="117" y="311" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#f5f9ff">Evaluate policy rules</text><text x="117" y="336" font-family="DejaVu Sans" font-size="15" fill="#a7bfd8">Priority, filters, groups, plan mapping and exclusions</text><rect x="48" y="376" width="1054" height="72" rx="14" fill="#17243a" stroke="#34516e"/><circle cx="83" cy="412" r="17" fill="#0d8bdc"/><text x="83" y="418" text-anchor="middle" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="white">4</text><text x="117" y="405" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#f5f9ff">Compile candidate graph</text><text x="117" y="430" font-family="DejaVu Sans" font-size="15" fill="#a7bfd8">Proposed nodes, links, circuit assignments</text><rect x="48" y="470" width="1054" height="72" rx="14" fill="#17243a" stroke="#34516e"/><circle cx="83" cy="506" r="17" fill="#0d8bdc"/><text x="83" y="512" text-anchor="middle" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="white">5</text><text x="117" y="499" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#f5f9ff">Validate</text><text x="117" y="524" font-family="DejaVu Sans" font-size="15" fill="#a7bfd8">Cycles, duplicate IPs, missing rates, stale reads, invalid parents</text><rect x="48" y="564" width="1054" height="72" rx="14" fill="#17243a" stroke="#34516e"/><circle cx="83" cy="600" r="17" fill="#0d8bdc"/><text x="83" y="606" text-anchor="middle" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="white">6</text><text x="117" y="593" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#f5f9ff">Inspect canvas diff</text><text x="117" y="618" font-family="DejaVu Sans" font-size="15" fill="#a7bfd8">Active vs proposed topology and export preview</text><rect x="48" y="658" width="1054" height="72" rx="14" fill="#17243a" stroke="#34516e"/><circle cx="83" cy="694" r="17" fill="#0d8bdc"/><text x="83" y="700" text-anchor="middle" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="white">7</text><text x="117" y="687" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#f5f9ff">Approve or revise</text><text x="117" y="712" font-family="DejaVu Sans" font-size="15" fill="#a7bfd8">Separate review from live publication</text></svg>