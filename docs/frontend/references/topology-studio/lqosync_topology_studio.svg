<rect x="1093" y="657" width="392" height="53" rx="8" class="card"/><text x="1105" y="677" class="white sm">Hotspot  ·  Active + Server</text><text x="1105" y="697" class="muted xs">Group by server · default plan</text><text x="1450" y="679" class="cyan sm">⚙</text>
