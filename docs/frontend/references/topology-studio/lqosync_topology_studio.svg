<rect x="1093" y="534" width="392" height="53" rx="8" class="card"/><text x="1105" y="555" class="white sm">DHCP / IPoE  ·  Bound leases</text><text x="1105" y="575" class="muted xs">Filter server · group by VLAN</text><text x="1450" y="558" class="cyan sm">⚙</text>
