<rect x="45" y="680" width="1009" height="216" rx="14" fill="#111f2e" stroke="#3d5367"/>
<text x="67" y="712" class="white label">CONFIGURATION WORKFLOW</text><text x="67" y="739" class="muted xs">One router can act as WAN provider and subscriber source. Source policies are independently configurable.</text>
<g font-family="Arial" font-size="14" font-weight="bold" fill="#e7f4fd" text-anchor="middle">
<rect x="65" y="772" width="155" height="58" rx="9" class="card"/><text x="142" y="797">01  Add router</text><text x="142" y="815" class="muted xs" font-weight="normal">Test and save</text>
<rect x="257" y="772" width="172" height="58" rx="9" class="card"/><text x="343" y="797">02  Add policies</text><text x="343" y="815" class="muted xs" font-weight="normal">Read / write scopes</text>
<rect x="468" y="772" width="167" height="58" rx="9" class="card"/><text x="550" y="797">03  Preview</text><text x="550" y="815" class="muted xs" font-weight="normal">Temporary Sankey</text>
<rect x="674" y="772" width="166" height="58" rx="9" class="card"/><text x="757" y="797">04  Load config</text><text x="757" y="815" class="muted xs" font-weight="normal">Saved canvas view</text>
<rect x="875" y="772" width="158" height="58" rx="9" class="card"/><text x="954" y="797">05  Reconcile</text><text x="954" y="815" class="muted xs" font-weight="normal">Safe auto-apply</text>
</g>
<g stroke="#7396af" stroke-width="2" fill="none"><path d="M224 800h27m-6 -5 6 5-6 5"/><path d="M432 800h30m-6 -5 6 5-6 5"/><path d="M638 800h30m-6 -5 6 5-6 5"/><path d="M844 800h25m-6 -5 6 5-6 5"/></g>
<text x="68" y="865" class="amber xs">IMPORTANT: Connection/test and source discovery never write to RouterOS. Write policies require separate authorization and action.</text>
<text x="45" y="962" class="dim xs">Concept only · Metrics synthetic · Existing implementation and proposed additions deliberately distinguished in design notes.</text>
