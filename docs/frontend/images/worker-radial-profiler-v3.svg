<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title description">
<title id="title">Interactive Worker 0 radial execution profiler</title>
<desc id="description">Hover over the ring to reveal phase labels; hover or focus a curved sector to expand it and see detailed counters. Cycle categories have equal angular sizes and do not imply CPU-time percentages.</desc>
<defs><linearGradient id="back" x2="0" y2="1"><stop stop-color="#10263b"/><stop offset="1" stop-color="#07111e"/></linearGradient><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#466d8b"/><stop offset=".48" stop-color="#162b40"/><stop offset="1" stop-color="#071523"/></linearGradient><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style><![CDATA[
text{font-family:Inter,system-ui,Segoe UI,sans-serif;fill:#e9f3ff}.muted{fill:#91a8bd}.sector{cursor:pointer;transition:stroke-width .26s ease,filter .26s ease,opacity .2s ease;outline:none}.sector.selected{stroke-width:37;filter:url(#glow);opacity:1!important}.ring{transition:transform .32s ease;transform-origin:440px 285px}.profiler.active .ring{transform:scale(1.025)}.callout{opacity:0;pointer-events:none;transition:opacity .22s ease}.profiler.active .callout{opacity:1}.callout.dim{opacity:.35}.call-name{font-size:12px;font-weight:700}.call-num{font-size:10px;fill:#a8bfd3}.detail{opacity:0;transition:opacity .2s ease}.detail.visible{opacity:1}.sector:focus-visible{stroke-width:37}@media(prefers-reduced-motion:reduce){.sector,.ring,.callout,.detail{transition:none}}
]]></style>
<rect width="1000" height="650" rx="20" fill="url(#back)"/><rect x="1" y="1" width="998" height="648" rx="19" fill="none" stroke="#294760"/>
<text x="30" y="38" font-size="21" font-weight="700">Worker Execution Profiler</text><text x="30" y="60" font-size="12" class="muted">W0 · hover ring for phase labels · hover a curved sector for diagnostics · click to pin</text>
<text x="966" y="38" font-size="12" fill="#38dba0" text-anchor="end">SNAPSHOT</text>
