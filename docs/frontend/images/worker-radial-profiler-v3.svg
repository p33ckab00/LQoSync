<g id="callouts"><g class="callout" data-i="0" style="--c:#1ba8f2"><path d="M497.8,126.2 L506.7,101.8 L682,101.8" fill="none" stroke="#1ba8f2" stroke-width="1.4"/><circle cx="497.8" cy="126.2" r="3" fill="#1ba8f2"/><text x="690" y="97.8" text-anchor="start" class="call-name">RX</text><text x="690" y="114.8" text-anchor="start" class="call-num">1,512,653,783,663 cycles</text></g><g class="callout" data-i="1" style="--c:#18c7c3"><path d="M586.4,200.5 L608.9,187.5 L682,187.5" fill="none" stroke="#18c7c3" stroke-width="1.4"/><circle cx="586.4" cy="200.5" r="3" fill="#18c7c3"/><text x="690" y="183.5" text-anchor="start" class="call-name">Dissect</text><text x="690" y="200.5" text-anchor="start" class="call-num">534,643,071,037 cycles</text></g><g class="callout" data-i="2" style="--c:#a17bff"><path d="M606.4,314.3 L632.0,318.9 L682,318.9" fill="none" stroke="#a17bff" stroke-width="1.4"/><circle cx="606.4" cy="314.3" r="3" fill="#a17bff"/><text x="690" y="314.9" text-anchor="start" class="call-name">Select</text><text x="690" y="331.9" text-anchor="start" class="call-num">580,037,740,886 cycles</text></g><g class="callout" data-i="3" style="--c:#f5b844"><path d="M548.6,414.5 L565.3,434.4 L682,434.4" fill="none" stroke="#f5b844" stroke-width="1.4"/><circle cx="548.6" cy="414.5" r="3" fill="#f5b844"/><text x="690" y="430.4" text-anchor="start" class="call-name">Leaf</text><text x="690" y="447.4" text-anchor="start" class="call-num">568,981,494,214 cycles</text></g><g class="callout" data-i="4" style="--c:#34d49a"><path d="M440.0,454.0 L440.0,480.0 L682,480.0" fill="none" stroke="#34d49a" stroke-width="1.4"/><circle cx="440.0" cy="454.0" r="3" fill="#34d49a"/><text x="690" y="476.0" text-anchor="start" class="call-name">TX</text><text x="690" y="493.0" text-anchor="start" class="call-num">123,589,123,462 cycles</text></g><g class="callout" data-i="5" style="--c:#72baff"><path d="M331.4,414.5 L314.7,434.4 L198,434.4" fill="none" stroke="#72baff" stroke-width="1.4"/><circle cx="331.4" cy="414.5" r="3" fill="#72baff"/><text x="190" y="430.4" text-anchor="end" class="call-name">Begin</text><text x="190" y="447.4" text-anchor="end" class="call-num">2,127,463,624,023 cycles</text></g><g class="callout" data-i="6" style="--c:#fb7584"><path d="M273.6,314.3 L248.0,318.9 L198,318.9" fill="none" stroke="#fb7584" stroke-width="1.4"/><circle cx="273.6" cy="314.3" r="3" fill="#fb7584"/><text x="190" y="314.9" text-anchor="end" class="call-name">Drop overdue</text><text x="190" y="331.9" text-anchor="end" class="call-num">10,857,240,998,207 cycles</text></g><g class="callout" data-i="7" style="--c:#8e9cb5"><path d="M293.6,200.5 L271.1,187.5 L198,187.5" fill="none" stroke="#8e9cb5" stroke-width="1.4"/><circle cx="293.6" cy="200.5" r="3" fill="#8e9cb5"/><text x="190" y="183.5" text-anchor="end" class="call-name">Charge</text><text x="190" y="200.5" text-anchor="end" class="call-num">0 cycles</text></g><g class="callout" data-i="8" style="--c:#c08afa"><path d="M382.2,126.2 L373.3,101.8 L198,101.8" fill="none" stroke="#c08afa" stroke-width="1.4"/><circle cx="382.2" cy="126.2" r="3" fill="#c08afa"/><text x="190" y="97.8" text-anchor="end" class="call-name">Handoff</text><text x="190" y="114.8" text-anchor="end" class="call-num">0 cycles</text></g></g>
</g>
<g id="detail" class="detail" pointer-events="none"><rect x="270" y="475" width="460" height="98" rx="12" fill="#112a3d" stroke="#38617d"/><rect id="detail-accent" x="270" y="475" width="5" height="98" rx="2" fill="#1ba8f2"/><text id="detail-name" x="291" y="501" font-size="16" font-weight="700">RX</text><text id="detail-value" x="291" y="528" font-size="16">0 cycles</text><text id="detail-desc" x="291" y="552" font-size="12" class="muted">Stage information</text><text x="707" y="502" font-size="10" class="muted" text-anchor="end">CLICK TO PIN</text></g>
