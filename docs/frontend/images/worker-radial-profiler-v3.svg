<script><![CDATA[
(function(){
const svg=document.documentElement,prof=document.getElementById('profiler'), sectors=[...svg.querySelectorAll('.sector')], calls=[...svg.querySelectorAll('.callout')], detail=document.getElementById('detail');
const info=[{"name": "RX", "value": 1512653783663, "color": "#1ba8f2", "description": "Receive processing cycles"}, {"name": "Dissect", "value": 534643071037, "color": "#18c7c3", "description": "Packet classification / dissection"}, {"name": "Select", "value": 580037740886, "color": "#a17bff", "description": "Queue selection processing"}, {"name": "Leaf", "value": 568981494214, "color": "#f5b844", "description": "Leaf queue processing"}, {"name": "TX", "value": 123589123462, "color": "#34d49a", "description": "Transmit processing"}, {"name": "Begin", "value": 2127463624023, "color": "#72baff", "description": "Loop begin accounting"}, {"name": "Drop overdue", "value": 10857240998207, "color": "#fb7584", "description": "Overdue-drop processing cost"}, {"name": "Charge", "value": 0, "color": "#8e9cb5", "description": "Charge stage (no recorded cycles)"}, {"name": "Handoff", "value": 0, "color": "#c08afa", "description": "Handoff stage (no recorded cycles)"}];
let pinned=-1,active=-1;
function show(i){active=i;prof.classList.add('active');sectors.forEach((s,j)=>{s.classList.toggle('selected',j===i);s.style.opacity=i>=0&&j!==i?'.62':'1'});calls.forEach((c,j)=>c.classList.toggle('dim',i>=0&&i!==j));detail.classList.toggle('visible',i>=0);if(i>=0){document.getElementById('detail-name').textContent=info[i].name;document.getElementById('detail-value').textContent=info[i].value.toLocaleString('en-US')+' cumulative cycles';document.getElementById('detail-desc').textContent=info[i].description;document.getElementById('detail-accent').setAttribute('fill',info[i].color)}}
function clear(){if(pinned>=0){show(pinned);return}active=-1;prof.classList.remove('active');sectors.forEach(s=>{s.classList.remove('selected');s.style.opacity='1'});calls.forEach(c=>c.classList.remove('dim'));detail.classList.remove('visible')}
prof.addEventListener('pointerenter',()=>prof.classList.add('active'));prof.addEventListener('pointerleave',clear);
prof.addEventListener('focusin',()=>prof.classList.add('active'));prof.addEventListener('focusout',e=>{if(!prof.contains(e.relatedTarget))clear()});
sectors.forEach((s,i)=>{s.addEventListener('pointerenter',()=>{if(pinned<0)show(i)});s.addEventListener('pointerleave',()=>{if(pinned<0){show(-1)}});s.addEventListener('focus',()=>{if(pinned<0)show(i)});s.addEventListener('click',()=>{pinned=pinned===i?-1:i;pinned>=0?show(pinned):show(-1)});s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();s.dispatchEvent(new Event('click'))}if(e.key==='Escape'){pinned=-1;show(-1)}})});
svg.addEventListener('keydown',e=>{if(e.key==='Escape'){pinned=-1;clear()}});
})();
]]></script>
<text x="500" y="465" font-size="10" class="muted" text-anchor="middle">Equal-angle category sectors · cumulative counters · not percentages of CPU time</text>
</svg>