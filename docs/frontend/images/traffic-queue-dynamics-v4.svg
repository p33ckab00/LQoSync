(function(){
const s=JSON.parse(document.getElementById('dataset').textContent), hit=document.getElementById('hit'), cursor=document.getElementById('cursor'), line=document.getElementById('cursor-line'), bg=document.getElementById('tip-bg'), txt=document.getElementById('tip-txt');
let pinned=null;const x0=70,x1=1220,N=s.actual_dl.length;
function draw(i){i=Math.max(0,Math.min(N-1,i));const xx=x0+(x1-x0)*i/(N-1);cursor.style.display='';line.setAttribute('x1',xx);line.setAttribute('x2',xx);const bx=xx>975?xx-222:xx+12;bg.setAttribute('x',bx);txt.setAttribute('x',bx+10);txt.textContent='';const rows=[`Sample: -${N-1-i}s`, `Actual ↓/↑: ${s.actual_dl[i]} / ${s.actual_ul[i]} Mbps`,`Mapped ↓/↑: ${s.mapped_dl[i]} / ${s.mapped_ul[i]} Mbps`,`Unmapped ↓/↑: ${(s.unmapped_dl[i]*1000).toFixed(1)} / ${(s.unmapped_ul[i]*1000).toFixed(1)} kbps`,`RTT Access / Internet: ${s.access_rtt[i]} / ${s.internet_rtt[i]} ms`,`Backlog: ${s.backlog[i].toLocaleString()} bytes`,`Drops/sample: ${s.drops[i]}`];rows.forEach((v,j)=>{const t=document.createElementNS('http://www.w3.org/2000/svg','tspan');t.setAttribute('x',bx+10);t.setAttribute('dy',j===0?'0':'19');t.textContent=v;txt.appendChild(t)});txt.setAttribute('y','106');}
function idx(evt){const p=hit.ownerSVGElement.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;const local=p.matrixTransform(hit.ownerSVGElement.getScreenCTM().inverse());return Math.round((local.x-x0)/(x1-x0)*(N-1))}
hit.addEventListener('pointermove',e=>{if(pinned===null)draw(idx(e))});hit.addEventListener('pointerleave',()=>{if(pinned===null)cursor.style.display='none'});hit.addEventListener('click',e=>{const i=idx(e);pinned=pinned===i?null:i;if(pinned===null)cursor.style.display='none';else draw(i)});hit.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();pinned=Math.max(0,Math.min(N-1,(pinned??N-1)+(e.key==='ArrowLeft'?-1:1)));draw(pinned)}if(e.key==='Enter'){pinned=pinned===null?N-1:null;if(pinned!==null)draw(pinned);else cursor.style.display='none'}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){pinned=null;cursor.style.display='none'}});
document.querySelectorAll('.legend-btn').forEach(el=>{function toggle(){const k=el.getAttribute('data-key'),p=document.getElementById('p-'+k),off=p.style.display==='none';p.style.display=off?'':'none';el.classList.toggle('off',!off)}el.addEventListener('click',toggle);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}})});
