<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" class="studio" data-theme="system" data-source="ppp" role="img" aria-labelledby="preview-title preview-desc"><title id="preview-title">Read-only discovery preview</title><desc id="preview-desc">The same canvas shows a candidate derived from a frozen snapshot, with provenance, validation issues, and a distinct saved topology revision.</desc><defs><style>
.studio{--bg:#f0f5fa;--panel:#fff;--card:#f7faff;--border:#a9bdcd;--text:#142f46;--muted:#486378;--grid:#d7e3ed;--accent:#096eaa;--teal:#087b70;--warn:#8c5600;--tint:#e0effc;--veil:#d7e3ed;--flow1:#158fc8;--flow2:#139b8b;color-scheme:light}
