" /><text x="63" y="724" font-size="19" class="" font-weight="700">Same canvas, temporary candidate</text><text x="63" y="756" font-size="14" class="muted">Dashed outline = changed policy. Band width = subscriber count.</text><text x="63" y="785" font-size="14" class="muted">No registry commit, RouterOS write, or live file publication.</text><text x="63" y="814" font-size="14" class="muted">Load saved topology returns to the current saved configuration.</text><text x="63" y="852" font-size="14" class="accent">Preview is optional. Saving a valid edit keeps normal auto-apply.</text><rect x="860" y="211" width="679" height="711" rx="12" class="panel" /><text x="885" y="249" font-size="21" class="" font-weight="700">Discovery evidence and validation</text><text x="886" y="286" font-size="14" class="" font-weight="700">PPP tables</text><text x="1040" y="286" font-size="13" class="muted">Complete · active + secret + profile</text><text x="886" y="338" font-size="14" class="" font-weight="700">DHCP tables</text><text x="1040" y="338" font-size="13" class="muted">Complete · lease + server</text><text x="886" y="390" font-size="14" class="" font-weight="700">Hotspot tables</text><text x="1040" y="390" font-size="13" class="muted">Complete · active + user + profile + server</text><text x="886" y="442" font-size="14" class="" font-weight="700">WAN routes</text><text x="1040" y="442" font-size="13" class="warn">Stale · last complete observation 72 s ago</text><text x="885" y="510" font-size="17" class="" font-weight="700">Why did this circuit get this rate?</text><rect x="884" y="534" width="629" height="56" rx="7" class="field" /><text x="899" y="556" font-size="14" class="" font-weight="700">demo-ppp-01</text><text x="899" y="577" font-size="13" class="muted">PLAN-15M · profile rate-limit</text><text x="1370" y="567" font-size="13" class="accent">15 / 15 Mbps</text><rect x="884" y="598" width="629" height="56" rx="7" class="field" /><text x="899" y="620" font-size="14" class=