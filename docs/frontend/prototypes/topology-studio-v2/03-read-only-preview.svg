@media(prefers-color-scheme:dark){.studio:not([data-theme="light"]):not([data-theme="dark"]){--bg:#0a131e;--panel:#111f2d;--card:#17283a;--border:#426078;--text:#edf5fb;--muted:#b1c3d3;--grid:#24364a;--accent:#67ccff;--teal:#52dec6;--warn:#ffd085;--tint:#193c56;--veil:#030a10;--flow1:#3eb5f0;--flow2:#30c8ad;color-scheme:dark}}
