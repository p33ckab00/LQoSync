[package]
name = "lqosync3"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "MikroTik subscriber sync for LibreQoS"
publish = false

[dependencies]
mikrotik-rs = { version = "=0.9.0", features = ["tokio-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "fs", "sync", "net", "io-util"] }
webpki-roots = "1"
anyhow = "1"
csv = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
