[package]
name = "lqosync-v3"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "lqosync-v3"

[dependencies]
anyhow = "1"
regex = "1"
axum = "0.8"
csv = "1"
maud = "0.27"
mikrotik-rs = { version = "=0.7.0", features = ["tokio-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "process", "fs", "io-util"] }
toml = "0.9"
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[patch.crates-io]
mikrotik-tokio = { path = "vendor/mikrotik-tokio" }
