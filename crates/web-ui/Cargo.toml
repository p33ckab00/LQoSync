[package]
name = "web-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
[dependencies]
web-contract = { path = "../web-contract" }
serde_json = "1"
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.8.23", features = ["csr"] }
gloo-net = "=0.6.0"
gloo-timers = { version = "=0.3.0", features = ["futures"] }
wasm-bindgen = "=0.2.108"
js-sys = "=0.3.85"
wasm-bindgen-futures = "=0.4.58"
web-sys = { version = "=0.3.85", features = ["DomRect", "PointerEvent", "KeyboardEvent", "AbortController", "AbortSignal", "Window", "Document", "HtmlElement", "Element", "HtmlInputElement", "HtmlSelectElement", "HtmlDocument", "MediaQueryList", "Location", "EventSource", "MessageEvent", "Event"] }
