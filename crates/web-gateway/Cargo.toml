[package]
name = "web-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
[dependencies]
web-contract = { path = "../web-contract" }
axum = "=0.8.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
argon2 = "=0.5.3"
rand = "=0.8.5"
sha2 = "=0.10.9"
libc = "0.2"
rpassword = "=7.4.0"
tower-http = { version = "=0.6.6", features = ["fs", "set-header"] }
[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
