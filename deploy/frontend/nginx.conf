# Use this server in an existing TLS deployment. Set WEB_BIND=127.0.0.1:9581.
server {
    listen 443 ssl;
    server_name lqosync.fsehub.qzz.io;
    # Set ssl_certificate and ssl_certificate_key for this host.
    location / {
        proxy_pass http://127.0.0.1:9581;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        client_max_body_size 4k;
    }
}
